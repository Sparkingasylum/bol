<!DOCTYPE html>
<html>
<head>
    <title>Html is fab</title>
</head>
<body>
    <h1>ordered list</h1>
    <ol>
        <li>fish</li>
        <li>apple</li>
        <li>eggs</li>
    </ol>
    <!-- how to lists in an orderly way-->
     <ol type="a">
        <li>fish</li>
        <li>apple</li>
        <li>eggs</li>
     </ol>
     <h2>unordered list</h2>
     <ul>
        <li>goat</li>
        <li>cow</li>
        <li>sheep</li>
     </ul>
</body>
</html>
