<!DOCTYPE html>
<html>
<head>
    <title>kloppite table</title>
</head>
<body>
    <h2>Table</h2>
    <table border="1px" align="left sided" width="50%">
        <tr>
            <th>player name</th>
            <!-- th is for column heading box-->
            <th>country</th>
        </tr>
        <tr>
            <td>Mohammed salah</td>
            <!-- td is for row under each column heading-->
            <td>Egypt</td>
        </tr>
        <tr>
            <td>Virgil van dirk</td>
            <td>Holland</td>
        </tr>
        <tr>
            <td>Alison Becker</td>
            <td>Brazil</td>
        </tr>
    </table>
</body>
</html>
