<!DOCTYPE html>
<html>
    <head>
        <title>Html is fab</title>
    </head>
    <body>
        <h1>changing text appearance</h1>
        <p>
            This is a ordinary text
            <br>
            <strong>This is a bold text</strong>
            <!-- this is prompt for bold-->
            <br>
            <em>This is an italic text</em>
            <!-- this is prompt for italic -->
            <br>
            <u>this is Mr grace</u>
            <!-- this is prompt for underline-->
            <br>
            <mark>Mr grace</mark>
            <!-- this is prompt for highlight -->
            <br>
            <em><strong><u>Nigeria is bleeding due to bad governance</u></strong></em>
            <!-- this is prompt for bold, italic and underline -->
        </p>
    </body>
</html>
