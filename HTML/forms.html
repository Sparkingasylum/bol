<!DOCTYPE html>
<html>
    <head>
        <title>Form template</title>
    </head>
    <body>
        <h1>Form</h1>
        <form action = "#" method = "post">
            <!-- # means the form will submit to the same page -->
             <!-- method="post" means the form data will be sent as a POST request -->
            <label for = "usr">please enter your username:</label>
            <input type = "text" name = "usr"> <br/>
            <label for = "email">please enter your email:</label>
            <input type = "email" id = "email" name = "email"> <br/>
            <label for = "password">please enter your password:</label>
            <input type = "password" id = "password" name = "password"> <br/>
            <label for = "dob">please enter your date of birth:</label>
            <input type = "date" id = "dob" name = "dob"> <br/>
            <input type = "submit" value = "Submit">
    </body>
</html>
